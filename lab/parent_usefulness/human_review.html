<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>You + JEV · Parent review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#223c35;font:17px/1.55 system-ui,sans-serif}header{background:white;border-bottom:1px solid #d9e1d8;padding:22px 30px}h1{font-size:28px;margin:0}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 10px}p{margin:.5em 0}.muted{font-size:14px;color:#596e65}button,select,textarea{font:inherit;color:inherit}button,select{border:1px solid #adbbb0;border-radius:9px;background:white;padding:10px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{background:#245f48;color:white;border-color:#245f48}button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #c38a36;outline-offset:3px}select{max-width:100%;width:min(470px,100%)}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.progress{font-weight:650}.layout{max-width:1450px;margin:26px auto;padding:0 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(350px,440px);gap:24px;align-items:start}.card{background:white;border:1px solid #dce2d9;border-radius:15px;padding:24px;min-width:0}aside{position:sticky;top:18px}.turn+.turn{border-top:1px solid #dce2d9;margin-top:28px;padding-top:24px}.label{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:#526b5d}.parent{padding:14px;background:#ecf1e9;border-radius:10px;white-space:pre-wrap}.reply{white-space:pre-wrap;margin:14px 0 20px}.images{display:grid;gap:12px}.images img{width:100%;height:auto;border:1px solid #dce2d9;border-radius:6px}.sources{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.sources img{max-height:180px;object-fit:contain}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:14px}.comparison>div{min-width:0}.choices{display:flex;flex-direction:column;gap:8px}.choices button{text-align:left}.verdict{font-size:19px;font-weight:750;margin:12px 0}.result{padding:12px;background:#edf3ec;border-radius:9px;margin:14px 0}.result.different{background:#fff0cf}.badge{display:inline-block;font-size:13px;background:#edf3ec;padding:3px 8px;border-radius:20px}.reason{font-size:15px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chips button{font-size:14px;padding:6px 10px}textarea{width:100%;min-height:75px;padding:10px;border:1px solid #adbbb0;border-radius:8px}details{margin-top:16px}a{color:#245f48}.alert{background:#fff0cf;border-radius:9px;padding:12px}.divider{border-top:1px solid #dce2d9;margin-top:20px;padding-top:18px}#saved{min-height:22px}#nextUnrated{width:100%;margin-top:20px;background:#245f48;color:white}.summary{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:14px}.skip{font-size:14px;margin-top:8px;border:0;padding-left:0;text-decoration:underline}.probability{display:flex;justify-content:space-between;font-size:14px}.rateLink{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:static}.rateLink{display:inline}}@media(max-width:500px){header{padding:18px}.layout{padding:0 10px;margin-top:16px}.card{padding:16px}.comparison{gap:10px}.toolbar button{font-size:15px}}
</style>
<header><h1>You + JEV</h1><p>Would this text work for your family? Rate it once, then compare with JEV.</p>
<div class="toolbar"><button id="prev" aria-label="Previous conversation">←</button><select id="cases" aria-label="Choose conversation"></select><button id="next" aria-label="Next conversation">→</button><span id="progress" class="progress"></span><button id="export">Export ratings</button><button id="importButton">Import ratings</button><input id="import" type="file" accept="application/json" hidden></div>
<div id="summary" class="summary"></div><p id="saved" class="muted" aria-live="polite">Saved automatically in this browser. Export a copy to keep your ratings.</p></header>
<main class="layout"><article id="content" class="card"></article><aside id="rating" class="card"></aside></main>
<script id="data" type="application/json">__RECORDS__</script><script>
const records=JSON.parse(document.querySelector('#data').textContent),key='curiosity-human-review-v3';
const labels={use_as_is:'Ready',small_edit_needed:'Needs edits',would_not_use:'Wouldn’t use',not_reviewable:'Can’t judge'};
const reasons={request:'Missed the request',constraints:'Forgot a constraint',effort:'Too much parent work',content:'Wrong or unclear text',delivery:'Missing output'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let votes={},position=0;const revealed=new Set();try{votes=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
function versionName(r){const peers=records.filter(x=>x.id===r.id).sort((a,b)=>a.fingerprint.localeCompare(b.fingerprint));return peers.length>1?' · '+String.fromCharCode(65+peers.indexOf(r)):''}
$('#cases').innerHTML=records.map((r,i)=>`<option value="${i}">${esc(r.id+versionName(r))} · ${esc((r.turns[1]?.parent||r.turns[0]?.parent||'Conversation').slice(0,72))}</option>`).join('');
function save(){try{localStorage.setItem(key,JSON.stringify(votes));$('#saved').textContent='Saved. Export ratings to keep a copy.'}catch{$('#saved').textContent='Browser storage unavailable. Export before closing.'}updateSummary()}
function updateSummary(){let reviewed=0,compared=0,same=0,passedBad=0,rejectedGood=0;for(const r of records){const v=votes[r.fingerprint];if(!v?.text_rating)continue;reviewed++;if(r.jev?.status!=='complete'||v.text_rating==='not_reviewable')continue;compared++;same+=v.text_rating===r.jev.use_as_is;passedBad+=r.jev.use_as_is==='use_as_is'&&v.text_rating!=='use_as_is';rejectedGood+=r.jev.use_as_is!=='use_as_is'&&v.text_rating==='use_as_is'}$('#progress').textContent=`${reviewed} / ${records.length} rated`;$('#summary').innerHTML=compared?`<span>Same verdict: <strong>${same}/${compared}</strong></span><span>JEV approved text you’d change: <strong>${passedBad}</strong></span><span>JEV flagged text you’d use: <strong>${rejectedGood}</strong></span>`:'<span>Rate a conversation to start your comparison.</span>'}
function pictures(items,source=false){return `<div class="images ${source?'sources':''}">`+items.map((x,i)=>`<a href="${esc(x.url)}" target="_blank" rel="noopener"><img src="${esc(x.url)}" alt="${source?'Source photo':'Delivered page'} ${i+1}" loading="lazy"></a>`).join('')+'</div>'}
function renderEvidence(r){$('#content').innerHTML=`<h2>${esc(r.id+versionName(r))}</h2><a class="rateLink" href="#rating">Jump to rating ↓</a>${r.status!=='captured'?`<p class="alert">Incomplete capture: ${esc(r.status)}</p>`:''}${r.errors.map(e=>`<p class="alert">${esc(e)}</p>`).join('')}${r.turns.map(t=>`<section class="turn"><div class="label">Parent · turn ${esc(t.number)}</div><p class="parent">${esc(t.parent)}</p>${t.sources.length?'<p class="label">Original photos · tap to enlarge</p>'+pictures(t.sources,true):''}<p class="label">Reply</p><div class="reply">${esc(t.message||'No reply captured.')}</div>${pictures(t.images)}${t.pdfs.map(p=>`<p><a href="${esc(p.url)}" target="_blank" rel="noopener">Open printable PDF ↗</a></p>`).join('')}</section>`).join('')}<details><summary>Run details</summary><p class="muted">${esc(r.delivery)}</p><p class="muted">Generation cost: ${r.cost==null?'unknown':'$'+Number(r.cost).toFixed(4)}. Source: ${esc(r.source)}</p></details>`}
function renderRating(){const r=records[position],v=votes[r.fingerprint]||{},j=r.jev,shown=Boolean(v.text_rating)||revealed.has(r.fingerprint),hasVisual=r.turns.some(t=>t.sources.length||t.images.length||t.pdfs.length),usable=j?.status==='complete';
$('#rating').innerHTML=`<h2>Text verdict</h2><p class="muted">Replies + printed instructions. Does the help answer the request and work with your constraints?</p><div class="comparison"><div><h3>You</h3><div class="choices">${Object.entries(labels).filter(([k])=>k!=='not_reviewable').map(([value,label],i)=>`<button data-rating="${value}" ${r.status!=='captured'?'disabled':''} aria-pressed="${v.text_rating===value}"><small>${i+1}</small> · ${label}</button>`).join('')}</div><button class="skip" data-rating="not_reviewable">Can’t judge</button></div><div><h3>JEV</h3>${!shown?'<p class="muted">Choose your verdict to reveal JEV’s.</p><button id="reveal" class="skip">Show now</button>':usable?`<p class="verdict">${labels[j.use_as_is]}</p><p class="reason">${esc(reasons[j.main_issue]||j.reason)}</p><span class="badge">${Number(j.seconds).toFixed(2)}s</span>`:'<p class="muted">'+esc(j?.reason||'No current JEV review.')+'</p>'}</div></div>
${v.text_rating&&usable&&v.text_rating!=='not_reviewable'?`<p class="result ${v.text_rating===j.use_as_is?'':'different'}">${v.text_rating===j.use_as_is?'You and JEV agree.':'Different verdicts — your rating is saved.'}</p>`:''}
${v.text_rating&&v.text_rating!=='use_as_is'&&v.text_rating!=='not_reviewable'?`<p class="muted">Main reason · optional</p><div class="chips">${Object.entries(reasons).map(([id,label])=>`<button data-reason="${id}" aria-pressed="${v.main_issue===id}">${label}</button>`).join('')}</div>`:''}
${hasVisual?`<div class="divider"><h3>Pictures · your check</h3><p class="muted">Do the source concepts and finished pictures match the request? JEV hasn’t checked the images.</p><div class="chips"><button data-visual="works" aria-pressed="${v.visual_rating==='works'}">Works</button><button data-visual="needs_fix" aria-pressed="${v.visual_rating==='needs_fix'}">Needs fixing</button><button data-visual="not_reviewable" aria-pressed="${v.visual_rating==='not_reviewable'}">Can’t tell</button></div></div>`:''}
<details ${v.note?'open':''}><summary>Add a note · optional</summary><label class="muted" for="note">What would you change?</label><textarea id="note" placeholder="One sentence is enough.">${esc(v.note||'')}</textarea></details>
${shown&&j?`<details><summary>JEV details</summary>${Object.entries(j.probabilities||{}).map(([k,p])=>`<div class="probability"><span>${labels[k]}</span><span>${Math.round(p*100)}%</span></div>`).join('')}<p class="muted">${esc(j.reviewer_model)} · ${esc(j.policy)} · ${j.estimated_cost_usd==null?'cost unknown':'$'+Number(j.estimated_cost_usd).toFixed(6)}. These probabilities are model estimates.</p></details>`:''}<button id="nextUnrated">Next unrated →</button><p class="muted">Shortcuts: 1 / 2 / 3 to rate · N for next</p>`;
document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{votes[r.fingerprint]={...votes[r.fingerprint],text_rating:b.dataset.rating,main_issue:b.dataset.rating==='use_as_is'?'none':v.main_issue==='none'?undefined:v.main_issue,reviewer_kind:'human',jev_seen_before_rating:Boolean(v.text_rating)||revealed.has(r.fingerprint),updated_at:new Date().toISOString()};save();renderRating()});
document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{votes[r.fingerprint]={...votes[r.fingerprint],main_issue:b.dataset.reason};save();renderRating()});document.querySelectorAll('[data-visual]').forEach(b=>b.onclick=()=>{votes[r.fingerprint]={...votes[r.fingerprint],visual_rating:b.dataset.visual,reviewer_kind:'human'};save();renderRating()});
$('#note').oninput=e=>{votes[r.fingerprint]={...votes[r.fingerprint],note:e.target.value,reviewer_kind:'human'};save()};if($('#reveal'))$('#reveal').onclick=()=>{revealed.add(r.fingerprint);renderRating()};$('#nextUnrated').onclick=nextUnrated}
function render(){const r=records[position];$('#cases').value=position;$('#prev').disabled=position===0;$('#next').disabled=position===records.length-1;renderEvidence(r);renderRating();updateSummary()}
function go(i){position=i;render();window.scrollTo(0,0)}
function nextUnrated(){for(let n=1;n<=records.length;n++){const i=(position+n)%records.length;if(!votes[records[i].fingerprint]?.text_rating){go(i);return}}$('#saved').textContent='All conversations rated. Export your ratings to keep them.'}
$('#prev').onclick=()=>go(position-1);$('#next').onclick=()=>go(position+1);$('#cases').onchange=e=>go(Number(e.target.value));
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;if(['1','2','3'].includes(e.key)){const b=document.querySelectorAll('[data-rating]')[Number(e.key)-1];if(b&&!b.disabled)b.click()}if(e.key.toLowerCase()==='n')nextUnrated()});
$('#export').onclick=()=>{const data={version:3,reviewer_kind:'human',scope:'text_and_separate_visual',records:records.map(r=>({id:r.id,fingerprint:r.fingerprint,source:r.source,jev_input_sha256:r.jev?.input_sha256,jev_policy:r.jev?.policy})),reviews:Object.fromEntries(records.filter(r=>votes[r.fingerprint]).map(r=>[r.fingerprint,votes[r.fingerprint]]))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='parent-jev-ratings.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#importButton').onclick=()=>$('#import').click();$('#import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const data=JSON.parse(await file.text());if(data.version!==3||data.reviewer_kind!=='human')throw Error('Import a You + JEV rating export. Earlier whole-page reviews have a different scope.');const allowed=new Set(records.map(r=>r.fingerprint));for(const [id,v]of Object.entries(data.reviews||{})){if(!allowed.has(id))continue;if(v.text_rating&&!labels[v.text_rating])throw Error('Unknown text rating');if(v.visual_rating&&!['works','needs_fix','not_reviewable'].includes(v.visual_rating))throw Error('Unknown picture rating');votes[id]={text_rating:v.text_rating,visual_rating:v.visual_rating,main_issue:v.main_issue==='none'||reasons[v.main_issue]?v.main_issue:undefined,note:String(v.note||''),reviewer_kind:'human',jev_seen_before_rating:v.jev_seen_before_rating,updated_at:v.updated_at}}save();render()}catch(error){$('#saved').textContent=error.message}};render();
</script></html>
