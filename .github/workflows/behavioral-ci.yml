name: behavioral-ci
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update
      - run: sudo apt-get install -y poppler-utils
      - run: python -m pip install --upgrade "pip>=26.2.2"
      - run: python -m pip install -e '.[dev,slack,all-providers]'
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest
      - run: curiosity-lab --repo . --json-out eval-report.json
      - run: python -m compileall -q src
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curiosity-eval-report
          path: eval-report.json
