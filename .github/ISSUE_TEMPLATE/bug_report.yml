name: Bug report
description: Report a reproducible problem using synthetic data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post family data, child details, Slack/workspace IDs, credentials, private logs/databases, purchased-resource details, or licensed excerpts. Security issues belong in private vulnerability reporting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Use a minimal synthetic example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Include redacted commands and synthetic inputs only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed family data, identifiers, credentials, licensed material, and private outputs.
          required: true
