name: Feature proposal
description: Propose a privacy-safe improvement using synthetic examples
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the general pattern only. Do not include family data, child details, Slack/workspace IDs, credentials, private outputs, or purchased-resource details/excerpts.
  - type: textarea
    id: need
    attributes:
      label: Family need
      description: What general problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain parent controls, failure behavior, and the smallest useful scope.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and safety impact
      description: Note any new data, provider disclosure, permissions, network calls, storage, or side effects.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Synthetic evaluation
      description: How could this be tested without family or licensed data?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This proposal contains only synthetic/public information.
          required: true
